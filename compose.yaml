services:
  # 1. Microservicio de IA (FastAPI / Heatmap)
  ai-service:
    build:
      context: ./ai-service      # Carpeta donde está main.py y su Dockerfile
      dockerfile: Dockerfile
    container_name: sistema-parqueo-ai
    restart: unless-stopped
    ports:
      - "8001:8001"              # Puerto que pide la app para el /heatmap
    volumes:
      - ./ai-service:/app        # Cambios en vivo 
    env_file:
      - .env

  # 2. Servidor de Expo (React Native)
  server:
    build: .
    image: valulu81/sistema-parqueo-udb-server:latest
    container_name: sistema-parqueo-server
    restart: unless-stopped
    user: "root"
    environment:
      NODE_ENV: development
    ports:
      - "8081:8081"              # Metro Bundler
      - "19000:19000"            # Puertos auxiliares de Expo para Expo Go
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/usr/src/app           
      - /usr/src/app/node_modules
    stdin_open: true             # Necesario para el QR interactivo de Expo
    tty: true
    env_file:
      - .env
    depends_on:
      - ai-service               # Levanta primero la IA antes de arrancar Expo